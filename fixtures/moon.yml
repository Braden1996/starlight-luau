$schema: "../.moon/cache/schemas/project.json"

layer: "configuration"
tags: ["luau"]

taskOptions:
  shell: false
  cache: false
  runFromWorkspaceRoot: false

tasks:
  typecheck:
    description: "luau-lsp on the new solver: the fixture library is valid strict Luau"
    command: "luau-lsp"
    args: ["analyze", "--flag:LuauSolverV2=true", "--platform=standard", "src", "harness"]
  check:
    description: "Aggregator: every fixture check"
    deps: ["~:typecheck"]
