version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      # One scope for every ecosystem: `include: scope` writes `deps-dev`, which pr-title rejects.
      prefix: build(deps)
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      packages:
        patterns: ["*"]
    commit-message:
      prefix: build(deps)
