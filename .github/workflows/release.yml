name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "An existing release tag to publish again, such as v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: tag is a release tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::$TAG is not a vX.Y.Z tag"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          cache: false
      - name: gate
        env:
          MOON_CACHE: write
        run: mise exec -- moon run :check
      - name: version matches tag
        run: |
          if ! grep -q "\"version\": \"${TAG#v}\"" packages/starlight-luau/package.json; then
            echo "::error file=packages/starlight-luau/package.json::version is not ${TAG#v}"
            exit 1
          fi
      - name: release notes
        run: |
          awk -v v="${TAG#v}" 'index($0, "## [" v "]") == 1 {on=1; next} /^## / && on {exit} on && !/^\[.*\]: http/' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then echo "::error file=CHANGELOG.md::no section for ${TAG#v}"; exit 1; fi
          cat notes.md
      - name: pack
        working-directory: packages/starlight-luau
        run: mise exec -- bun pm pack --destination ../..
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tarball="starlight-luau-${TAG#v}.tgz"
          test -f "$tarball"
          sha256sum "$tarball" > SHA256SUMS
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$tarball" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$tarball" SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
          fi
      - name: npm publish
        run: |
          if [ "$(mise exec -- npm view "starlight-luau@${TAG#v}" version 2> /dev/null)" = "${TAG#v}" ]; then
            echo "starlight-luau ${TAG#v} is already on npm"
          else
            mise exec -- npm publish "starlight-luau-${TAG#v}.tgz" --provenance --access public
          fi
