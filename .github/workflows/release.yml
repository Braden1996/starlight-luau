name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5.2.8
        with:
          install_args: bun node aqua:rhysd/actionlint aqua:zizmorcore/zizmor aqua:lycheeverse/lychee aqua:gitleaks/gitleaks
          cache: false
      - uses: Braden1996/sergeant-releases/actions/setup@v0.15.0
      - uses: Braden1996/sergeant-releases/actions/setup-luau@v0.15.0
        with:
          luau-ast: "true"
          woof: "false"
      - name: Fetch pinned Sergeant config tarballs
        run: |
          mkdir -p ../sergeant/dist/npm
          npm pack --ignore-scripts --pack-destination ../sergeant/dist/npm @sgt-build/tsconfig@0.15.0 @sgt-build/oxlint-config@0.15.0
      - uses: Braden1996/sergeant-releases/actions/ci@v0.15.0
      - name: Build the Node entry point for npm
        working-directory: packages/libraries/ts/node/starlight-luau
        run: |
          bun build src/index.ts --target=node --packages=external --outfile=dist/index.js
          bun pm pkg set 'exports[.].default=./dist/index.js'
      - uses: Braden1996/sergeant-releases/actions/release-npm@v0.15.0
        with:
          working-directory: packages/libraries/ts/node/starlight-luau
          changelog: ../../../../../CHANGELOG.md
          smoke-import: starlight-luau
